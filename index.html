<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Nexa Tecnología | Nexa, tecnología que conecta contigo.</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap');

/* ============ TOKENS ============ */
:root{
  --bg:#07080A; --dark:#0E1017; --card:#141720; --card-hover:#1B202D;
  --line:#242A3B; --line-soft:#33394A; --muted:#8E96A8; --ink:#EDEFF3;
  --accent:#FF6B00; --accent-hover:#E05E00; --accent-dim:rgba(255,107,0,.14);
  --radius:16px; --radius-sm:10px;
  --font-sans:'Inter',system-ui,sans-serif;
  --font-display:'Space Grotesk',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}

/* ============ RESET ============ */
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans);
  -webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;
  justify-content:space-between;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;background:none;border:none;color:inherit}
input,textarea,select{font-family:inherit;color:inherit}
img{display:block;max-width:100%}
h1,h2,h3,h4,p{margin:0}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ============ UTILITIES ============ */
.container{max-width:1200px;margin:0 auto;padding:0 20px}
.flex{display:flex} .flex-col{flex-direction:column} .flex-wrap{flex-wrap:wrap}
.items-center{align-items:center} .items-end{align-items:flex-end} .items-start{align-items:flex-start}
.justify-between{justify-content:space-between} .justify-center{justify-content:center}
.gap-1{gap:6px} .gap-2{gap:10px} .gap-3{gap:14px} .gap-4{gap:20px}
.grow{flex-grow:1} .hidden{display:none!important} .w-full{width:100%}
.text-center{text-align:center} .text-right{text-align:right}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.muted{color:var(--muted)} .mono{font-family:var(--font-mono)} .accent{color:var(--accent)}
.fw-600{font-weight:600} .fw-700{font-weight:700} .fw-800{font-weight:800}
.t-xs{font-size:.72rem} .t-sm{font-size:.82rem} .t-base{font-size:.9rem} .t-lg{font-size:1.05rem}

/* ============ HEADER ============ */
.site-header{position:sticky;top:0;z-index:40;background:rgba(7,8,10,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(36,42,59,.7)}
.site-header__bar{display:flex;align-items:center;justify-content:space-between;gap:16px;height:76px}
.brand{display:flex;align-items:center;gap:12px;flex-shrink:0}
.brand__mark{width:34px;height:34px;flex-shrink:0;transition:transform .3s}
.brand:hover .brand__mark{transform:scale(1.06)}
.brand__word{display:flex;flex-direction:column}
.brand__wordmark{display:flex;align-items:center;color:#fff;font-family:var(--font-mono);font-weight:800;letter-spacing:.28em;font-size:1.2rem;line-height:1}
.brand__a{position:relative;display:inline-block;margin-left:2px}
.brand__dot{position:absolute;bottom:2px;right:0;width:4px;height:3px;background:var(--accent)}
.brand__tagline{font-size:6.8px;letter-spacing:.3em;color:var(--muted);text-transform:uppercase;font-weight:700;margin-top:6px;white-space:nowrap}
.search{position:relative;flex-grow:1;max-width:420px;margin:0 24px;display:none}
.search__input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 34px;font-size:.78rem;color:#fff}
.search__input::placeholder{color:var(--muted)}
.search__input:focus{outline:none;border-color:var(--accent)}
.search__icon{position:absolute;left:14px;top:12px;color:var(--muted);font-size:.72rem}
.search__clear{position:absolute;right:12px;top:10px;color:var(--muted);font-size:.72rem}
.search__clear:hover{color:#fff}
.header-actions{display:flex;align-items:center;gap:10px}
.wa-pill{display:none;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;background:rgba(5,150,105,.1);border:1px solid rgba(16,185,129,.3);color:#34d399;font-size:.72rem;font-weight:700}
.wa-pill:hover{background:#059669;color:#fff}
.admin-pill{padding:10px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--muted);display:flex;align-items:center;gap:8px}
.admin-pill:hover{color:#fff;border-color:var(--accent)}
.admin-pill__label{display:none;font-size:.72rem;font-weight:600}
.mobile-search{padding:0 0 14px}
@media(min-width:768px){
  .search{display:flex} .mobile-search{display:none} .wa-pill{display:flex}
  .admin-pill__label{display:inline}
}

/* ============ HERO ============ */
.hero{position:relative;border-radius:20px;background:var(--card);border:1px solid var(--line);
  padding:44px 24px;overflow:hidden}
.hero__mark{position:absolute;right:-40px;top:50%;transform:translateY(-50%);width:280px;height:280px;opacity:.5;pointer-events:none}
.hero__content{position:relative;z-index:1;max-width:620px}
.hero__label{font-family:var(--font-mono);font-size:.68rem;letter-spacing:.12em;color:var(--muted);margin-bottom:14px;display:block}
.hero__title{font-family:var(--font-display);font-weight:700;color:#fff;font-size:clamp(2rem,5.2vw,3rem);line-height:1.08;letter-spacing:-.01em}
.hero__title .line2{color:var(--accent)}
.hero__lead{margin-top:16px;color:var(--muted);font-size:.92rem;line-height:1.65;max-width:480px}
.hero__meta{margin-top:20px;display:flex;flex-wrap:wrap;gap:20px;font-family:var(--font-mono);font-size:.72rem;color:var(--muted)}
.hero__meta i{color:var(--accent);margin-right:6px}
.hero__cta{margin-top:26px}
@media(min-width:640px){.hero{padding:56px 48px}}

/* ============ SECTIONS ============ */
.section{margin-top:40px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.section-head__title{font-family:var(--font-display);font-size:1rem;font-weight:600;color:#fff}
.section-head__meta{font-family:var(--font-mono);font-size:.7rem;color:var(--muted)}

/* ============ CHIPS ============ */
.chips{display:flex;align-items:center;gap:10px;overflow-x:auto;padding-bottom:8px}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:10px 18px;border-radius:11px;font-size:.75rem;font-weight:600;white-space:nowrap;
  border:1px solid var(--line);background:var(--card);color:var(--muted);transition:all .15s}
.chip:hover{color:#fff}
.chip--active{background:var(--accent);border-color:var(--accent);color:#fff}

/* ============ TOOLBAR ============ */
.toolbar{display:flex;flex-direction:column;gap:14px;align-items:flex-start;justify-content:space-between;
  padding-top:20px;border-top:1px solid rgba(36,42,59,.6)}
.sort{display:flex;align-items:center;gap:10px}
.sort__label{font-size:.72rem;color:var(--muted);font-family:var(--font-mono)}
.sort__select{background:var(--card);border:1px solid var(--line);color:#fff;font-size:.72rem;border-radius:10px;padding:9px 12px}
@media(min-width:640px){.toolbar{flex-direction:row;align-items:center}}

/* ============ PRODUCT GRID ============ */
.grid-products{display:grid;grid-template-columns:1fr;gap:22px;margin-top:20px}
@media(min-width:640px){.grid-products{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1024px){.grid-products{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1280px){.grid-products{grid-template-columns:repeat(4,1fr)}}

.product-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
  display:flex;flex-direction:column;justify-content:space-between;transition:border-color .2s}
.product-card:hover{border-color:rgba(255,107,0,.5)}
.product-card__media{position:relative;height:220px;background:var(--dark);overflow:hidden;cursor:pointer}
.product-card__media img{width:100%;height:100%;object-fit:cover;opacity:.92;transition:transform .5s,opacity .3s}
.product-card:hover .product-card__media img{transform:scale(1.05);opacity:1}
.product-card__badges{position:absolute;top:12px;left:12px;display:flex;flex-direction:column;gap:4px}
.badge{padding:5px 10px;border-radius:6px;font-size:.62rem;font-family:var(--font-mono);font-weight:700}
.badge--featured{background:rgba(0,0,0,.9);border:1px solid rgba(255,107,0,.5);color:var(--accent)}
.badge--sale{background:#dc2626;color:#fff}
.status-overlay{position:absolute;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center}
.status-tag{padding:7px 14px;border-radius:8px;font-family:var(--font-mono);font-size:.72rem;font-weight:700;text-transform:uppercase}
.status-tag--oos{background:rgba(69,10,10,.9);border:1px solid rgba(239,68,68,.5);color:#f87171}
.status-tag--soon{background:rgba(23,37,84,.9);border:1px solid rgba(59,130,246,.5);color:#60a5fa}
.product-card__body{padding:20px}
.product-card__title{font-weight:700;color:#fff;font-size:.86rem;cursor:pointer;line-height:1.35}
.product-card__title:hover{color:var(--accent)}
.product-card__desc{margin-top:8px;font-size:.76rem;color:var(--muted);line-height:1.55}
.product-card__footer{padding:0 20px 20px}
.price-row{padding-top:16px;border-top:1px solid rgba(36,42,59,.6);display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.price__old{font-size:.68rem;color:var(--muted);text-decoration:line-through;font-family:var(--font-mono);display:block}
.price__new{font-size:1.1rem;font-weight:800;color:#fff;font-family:var(--font-mono)}
.price__usd{font-size:.65rem;color:var(--muted);font-family:var(--font-mono)}

/* ============ BUTTONS ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;
  border-radius:11px;font-size:.75rem;font-weight:700;transition:all .18s;width:100%}
.btn--primary{background:var(--accent);color:#fff}
.btn--primary:hover{background:var(--accent-hover)}
.btn--whatsapp{background:#059669;color:#fff}
.btn--whatsapp:hover{background:#10b981}
.btn--disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
.btn--outline{background:var(--card);border:1px solid var(--line);color:#fff;width:auto}
.btn--outline:hover{background:var(--card-hover)}
.btn--danger{background:#dc2626;color:#fff;width:auto}
.btn--danger:hover{background:#ef4444}
.btn--icon{width:auto;padding:12px;background:var(--line);color:#fff}
.btn--icon:hover{background:var(--line-soft)}
.btn--auto{width:auto}
.btn--sm{padding:9px 14px;font-size:.7rem}

/* ============ EMPTY STATE ============ */
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;background:rgba(20,23,32,.4);border:1px solid var(--line);border-radius:var(--radius)}
.empty i{font-size:2.4rem;color:var(--muted)}
.empty p{margin-top:14px;font-weight:600;color:#fff;font-size:.85rem}
.empty button{margin-top:16px}

/* ============ PRODUCT PAGE ============ */
.back-link{display:inline-flex;align-items:center;gap:8px;font-size:.75rem;color:var(--muted)}
.back-link:hover{color:#fff}
.product-layout{display:grid;grid-template-columns:1fr;gap:40px;margin-top:20px}
@media(min-width:1024px){.product-layout{grid-template-columns:1fr 1fr}}
.gallery__main{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);height:340px;overflow:hidden}
@media(min-width:640px){.gallery__main{height:420px}}
.gallery__main img{width:100%;height:100%;object-fit:cover}
.gallery__thumbs{display:flex;gap:8px;overflow-x:auto;margin-top:12px}
.gallery__thumb{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer;flex-shrink:0}
.gallery__thumb:hover{border-color:var(--accent)}
.product-info{display:flex;flex-direction:column;gap:18px}
.product-info__cat{font-family:var(--font-mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:700}
.product-info__title{font-family:var(--font-display);font-size:1.5rem;font-weight:600;color:#fff;margin-top:6px}
.product-info__desc{font-size:.85rem;color:var(--muted);line-height:1.7}
.specs-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.spec-item{padding:10px;background:var(--card);border:1px solid var(--line);border-radius:9px;font-size:.72rem}
.spec-item b{color:#fff;font-weight:600}
.price-box{padding:20px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.price-box__final{font-family:var(--font-mono);font-size:1.8rem;font-weight:800;color:#fff}
.price-box__meta{font-family:var(--font-mono);font-size:.68rem;color:var(--muted);margin-top:4px}
.actions{display:flex;gap:10px}

/* ============ FOOTER ============ */
.site-footer{border-top:1px solid rgba(36,42,59,.8);padding:36px 0;margin-top:60px}
.site-footer__inner{display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center}
.site-footer__brand{display:flex;align-items:center;gap:10px}
@media(min-width:640px){.site-footer__inner{flex-direction:row;justify-content:space-between;text-align:right}}

/* ============ TOAST ============ */
.toast-stack{position:fixed;bottom:24px;right:24px;z-index:80;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{pointer-events:auto;background:var(--card);border:1px solid var(--accent);color:#fff;padding:12px 18px;
  border-radius:11px;box-shadow:0 12px 30px rgba(0,0,0,.4);display:flex;align-items:center;gap:10px;font-size:.75rem;font-weight:600;
  max-width:300px;animation:toast-in .2s ease-out}
.toast--error{border-color:#ef4444;color:#f87171}
.toast i{color:var(--accent)}
.toast--error i{color:#ef4444}
@keyframes toast-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ============ ADMIN MODAL ============ */
.admin-overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);backdrop-filter:blur(10px);
  display:none;align-items:center;justify-content:center;padding:8px}
.admin-overlay.is-open{display:flex}
.admin-modal{background:var(--card);border:1px solid var(--line);border-radius:14px;max-width:1400px;width:100%;
  height:97vh;display:flex;flex-direction:column;overflow:hidden;position:relative;box-shadow:0 24px 80px rgba(0,0,0,.45)}
.admin-modal__header{padding:11px 16px;border-bottom:1px solid var(--line);background:var(--dark);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;min-height:48px}
.admin-modal__title{font-family:var(--font-mono);font-weight:800;color:#fff;font-size:.82rem}
.admin-modal__tag{padding:4px 8px;border-radius:6px;background:var(--accent-dim);border:1px solid rgba(255,107,0,.3);color:var(--accent);font-family:var(--font-mono);font-size:.56rem;font-weight:700}
.admin-modal__close{color:var(--muted);font-size:1rem;padding:6px}
.admin-modal__close:hover{color:#fff}

.admin-login{flex-grow:1;display:flex;align-items:center;justify-content:center;padding:24px;overflow-y:auto}
.admin-login__card{max-width:400px;width:100%;background:var(--dark);padding:32px;border-radius:18px;border:1px solid var(--line);
  display:flex;flex-direction:column;gap:22px}
.admin-login__icon{font-size:1.8rem;color:var(--accent);text-align:center}
.admin-login__card h3{color:#fff;font-size:1.15rem;font-weight:700;text-align:center;margin-top:8px}
.admin-login__card p{text-align:center;font-size:.75rem;color:var(--muted)}
.error-box{padding:12px;background:rgba(69,10,10,.5);border:1px solid rgba(239,68,68,.4);color:#f87171;font-size:.72rem;
  border-radius:10px;text-align:center;font-family:var(--font-mono)}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:.68rem;font-weight:600;color:var(--ink)}
.field-input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 14px;
  font-size:.8rem;color:#fff}
.field-input:focus{outline:none;border-color:var(--accent)}
.field-hint{font-size:.62rem;color:var(--muted);line-height:1.5}

.admin-dashboard{display:none;flex-grow:1;flex-direction:column;overflow:hidden}
.admin-dashboard.is-open{display:flex}
@media(min-width:768px){.admin-dashboard.is-open{flex-direction:row}}
.admin-sidebar{background:var(--dark);border-right:1px solid var(--line);padding:8px;display:flex;flex-wrap:wrap;gap:3px;
  flex-shrink:0;overflow-y:auto;overflow-x:hidden}
@media(min-width:768px){.admin-sidebar{width:210px;min-width:210px;flex-direction:column;display:flex}}
.admin-nav-btn{width:100%;text-align:left;padding:8px 10px;border-radius:8px;font-size:.66rem;font-weight:700;
  display:flex;align-items:center;gap:8px;color:var(--muted);min-height:34px}
.admin-nav-btn:hover{color:#fff}
.admin-nav-btn.is-active{background:var(--accent);color:#fff}
.admin-nav-btn i{width:16px;text-align:center}
.admin-content{flex-grow:1;min-width:0;padding:14px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.admin-content>.section-head__title{margin-top:2px}
.admin-content .panel{padding:14px}
.admin-content .form-panel{padding:14px;gap:12px}
.admin-content .field-input{padding:9px 11px;font-size:.76rem}
.admin-content textarea.field-input{min-height:92px;resize:vertical}
.admin-content .btn{padding:9px 14px;font-size:.69rem}
.admin-content .table-wrap{max-height:none}
@media(max-width:767px){
  .admin-overlay{padding:0}
  .admin-modal{height:100dvh;max-width:none;border-radius:0;border-left:0;border-right:0}
  .admin-modal__header{padding:9px 12px}
  .admin-sidebar{border-right:0;border-bottom:1px solid var(--line);padding:5px;display:flex;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;gap:3px}
  .admin-nav-btn{width:auto;flex:0 0 auto;padding:7px 9px;min-height:30px;font-size:.62rem;white-space:nowrap}
  .admin-content{padding:10px;gap:10px}
  .admin-content .form-grid{grid-template-columns:1fr}
}

/* ============ ADMIN COMPACT WORKSPACE ============ */
.admin-modal{width:min(1400px,97vw)!important;height:97vh!important;max-height:97vh!important}
.admin-content{padding:12px!important;gap:12px!important}
.admin-content .panel{padding:12px}
.admin-content .form-panel{padding:12px;gap:10px}
.admin-content .field{gap:4px}
.admin-content .field-input{padding:8px 10px;font-size:.74rem}
.admin-content textarea.field-input{min-height:80px}
.admin-content .btn{padding:8px 12px;font-size:.68rem}
.admin-content .stat-grid{gap:10px}
.admin-content .stat-card{padding:12px}
.admin-content .table-wrap{overflow:auto}
@media(max-width:767px){
  .admin-modal{width:100vw!important;height:100dvh!important;max-height:100dvh!important}
  .admin-sidebar{width:100%!important;min-width:0!important}
  .admin-content{padding:9px!important;gap:9px!important}
}

/* Cards / stats within admin */
.panel{background:var(--dark);border:1px solid var(--line);border-radius:14px;padding:22px}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:768px){.stat-grid{grid-template-columns:repeat(4,1fr)}}
.stat-card{padding:18px;background:var(--dark);border:1px solid var(--line);border-radius:12px}
.stat-card__label{font-size:.68rem;color:var(--muted)}
.stat-card__value{font-size:1.4rem;font-weight:800;color:#fff;font-family:var(--font-mono);margin-top:6px}
.list-row{display:flex;justify-content:space-between;font-size:.72rem;padding:7px 0;border-bottom:1px solid rgba(36,42,59,.5)}
.list-row:last-child{border-bottom:none}
.list-row span:last-child{font-family:var(--font-mono);color:var(--accent)}

.form-panel{background:var(--dark);border:1px solid rgba(255,107,0,.4);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:16px}
.form-grid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:640px){.form-grid{grid-temp
